# Information about the original article that has been replicated
replication:
 - cite: "Hou, Y., Zhang, X., Graf, P., Tripp, C., & Biagioni, D. (2021). A Cyber-Physical System for Freeway Ramp Meter Signal Control Using Deep Reinforcement Learning in a Connected Environment. In 2021 IEEE Intelligent Transportation Systems Conference (ITSC), pp. 1--8."
 - bib:  hou2021rampmeter
 - url:  https://doi.org/10.1109/ITSC48978.2021.9564699
 - doi:  10.1109/ITSC48978.2021.9564699


abstract: "The goal of this replication study is to verify the claim by Hou et al. that, for freeway ramp metering signal control, the reinforcement learning algorithms Ape-X DQN, PPO, and A3C outperform the baseline controllers no ramp metering, fixed-time control and ALINEA. The comparison is conducted under mixed near-congested/congested and extremely congested traffic conditions, using traffic throughput, average vehicle speed and per-vehicle averages for stops, fuel efficiency, CO\textsubscript{2} emissions, and NO\textsubscript{x} emissions as evaluation metrics."

